name: Assemble canonically named VN backgrounds
on:
  push:
    paths:
      - '.transfer/manifests/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify full-resolution PNGs
        run: python3 scripts/assemble_backgrounds.py
      - name: Commit generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified Aureval visual novel backgrounds'
            git push
          fi
